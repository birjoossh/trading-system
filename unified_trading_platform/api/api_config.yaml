# API Configuration File
# Default values for the Unified Trading Platform API

# API Metadata
api:
  title: "Unified Trading Platform API"
  version: "0.1.0"
  description: |
    ## Unified Trading Platform API

    A comprehensive REST API for algorithmic trading across multiple brokers.

    ### Features

    * **Broker Management**: Connect and manage multiple broker connections
    * **Market Data**: Retrieve historical data and option chains
    * **Order Execution**: Submit and manage orders (market, limit, stop)
    * **Strategy Execution**: Run and monitor algorithmic trading strategies
    * **Portfolio Tracking**: Monitor positions and portfolio performance

    ### Authentication

    Currently, the API does not require authentication. In production, implement proper security measures.

    ### Base URL

    All endpoints are prefixed with the API base path. The API uses JSON for request and response bodies.
  terms_of_service: "https://example.com/terms/"
  contact:
    name: "API Support"
    url: "https://example.com/contact/"
    email: "support@example.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
  openapi_url: "/api/v1/openapi.json"
  docs_url: "/docs"
  redoc_url: "/redoc"
  logo_url: "https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png"

# Tag Metadata
tags:
  - name: "health"
    description: "Health check endpoints for monitoring API availability and status."
  - name: "brokers"
    description: "Broker management endpoints for connecting, disconnecting, and managing broker connections. Includes account information retrieval."
  - name: "data"
    description: "Market data endpoints for retrieving historical data, option chains, and subscribing to real-time market data."
  - name: "orders"
    description: "Order management endpoints for submitting, canceling, and tracking orders. Includes position and trade history."
  - name: "strategies"
    description: "Strategy execution endpoints for initializing, starting, stopping, and monitoring trading strategies."

# Default Broker Configuration
broker:
  default_host: "127.0.0.1"
  default_port: 7498
  default_client_id: 1
  broker_types:
    - "interactive_brokers"
    - "paper_broker"

# Default Contract/Order Configuration
contract:
  default_security_type: "STK"
  default_currency: "USD"
  default_exchange: ""
  default_time_in_force: "DAY"

# Default Data Configuration
data:
  default_duration: "1 D"
  default_bar_size: "1 hour"
  default_market_data_type: "DELAYED"
  default_snapshot: false

# Default Strategy Configuration
strategy:
  default_db_path: "trading_system.db"
  default_status: "INITIAL"
  status_options:
    - "INITIAL"
    - "RUNNING"
    - "FINISHED"
    - "ERROR"

# Default Portfolio Configuration
portfolio:
  default_total_pnl: 0.0
  default_open_positions: 0
  default_closed_positions: 0
  default_total_positions: 0
  default_pending_reentries: 0

# Allowed Values (for validation)
allowed_values:
  security_types:
    - "STK"
    - "OPT"
    - "FUT"
    - "CASH"
  currencies:
    - "USD"
    - "INR"
    - "EUR"
  exchanges:
    - "SMART"
    - "NYSE"
    - "NASDAQ"
    - "NSE"
  time_in_force:
    - "DAY"
    - "GTC"
    - "IOC"
    - "FOK"
  order_actions:
    - "BUY"
    - "SELL"
  order_status:
    - "submitted"
    - "pending"
    - "filled"
    - "cancelled"
    - "rejected"
  bar_sizes:
    - "1 min"
    - "5 min"
    - "15 min"
    - "30 min"
    - "1 hour"
    - "1 day"
  durations:
    - "1 D"
    - "1 W"
    - "1 M"
    - "1 Y"
  market_data_types:
    - "DELAYED"
    - "REALTIME"
