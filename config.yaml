# Unified Configuration for Trading Platform

# ==========================================
# SYSTEM (Runtime / User Configurable)
# ==========================================
system:
  max_concurrent_orders: 100
  order_timeout: 30
  data_cache_ttl: 300
  default_exchange: "NSE"
  # Background thread behaviour (seconds)
  event_queue_poll_s: 1.0    # how long a worker waits on an empty queue
  shutdown_timeout_s: 5.0    # how long shutdown waits for a worker to stop

exchanges:
  NSE:
    currency: "INR"
    timezone: "Asia/Kolkata"
    trading_hours:
      start: "09:15"
      end: "15:30"
    expiry:
      switch_date: "2025-09-01"
      weekly_day_before: 3 # Thursday
      weekly_day_after: 1  # Tuesday
  NYSE:
    currency: "USD"
    timezone: "America/New_York"
    trading_hours:
      start: "09:30"
      end: "16:00"
    expiry:
      weekly_day: 4 # Friday (0=Mon, 4=Fri)

logging:
  level: "INFO"
  file: "trading_core.log"
  console: true

database:
  path: "trading_system.db"
  # Support future SQL backends if needed
  type: "sqlite" 

# ==========================================
# BROKERS (Runtime / Connection Details)
# ==========================================
brokers:
  interactive_brokers:
    enabled: true
    host: "127.0.0.1"
    port: 4002  # TWS Live: 7496, Paper: 7497; Gateway Live: 4001, Paper: 4002
    client_id: 1
    timeout: 10
    # How long to wait for each kind of TWS response (seconds)
    timeouts:
      connect_s: 20
      historical_data_s: 30
      contract_details_s: 10
      option_params_s: 30
      market_data_s: 15

  paper_broker:
    enabled: true
    data_dir: "data/paper"
    # Replay runs at full speed by default. Raise these only to simulate
    # exchange latency or to pace a replay against a wall clock; they change
    # how long a run takes, never what it produces.
    fill_delay_s: 0.0        # latency between acknowledgement and fill
    emit_interval_s: 0.0     # pause between replayed ticks when streaming
    poll_interval_s: 0.5     # how often the SQLite tailer looks for new rows
    # Price concession per fill, in points. Buys fill higher, sells lower.
    # Leave at 0 if you model execution cost via backtest.costs instead —
    # setting both counts slippage twice.
    slippage_per_fill: 0.0

# ==========================================
# PRICING (Black-Scholes / implied volatility)
# ==========================================
pricing:
  risk_free_rate: 0.06       # annual, decimal
  dividend_yield: 0.0        # annual, decimal
  min_option_price: 0.01     # premiums below this are treated as untradeable noise
  implied_vol:
    lower_bound: 0.000001
    upper_bound: 5.0
    tolerance: 0.000001
    max_iterations: 100

# ==========================================
# BACKTEST (Historical replay behaviour)
# ==========================================
backtest:
  bar_size: "1min"           # granularity of the underlying bars driving replay
  default_duration_days: 30  # fallback when a duration string cannot be parsed
  max_reentries_cap: 20      # hard ceiling on re-entries per leg, whatever a strategy asks for
  # Default execution costs. A strategy's own "costs" block overrides these.
  costs:
    per_lot_roundtrip: 0.0   # commission etc. per lot, charged over a full round trip
    slippage_per_fill: 0.0   # price concession per fill, in points

# ==========================================
# API Metadata (Static)
# ==========================================
api:
  title: "Unified Trading Platform API"
  version: "0.1.0"
  description: |
    ## Unified Trading Platform API

    A comprehensive REST API for algorithmic trading across multiple brokers.

    ### Features

    * **Broker Management**: Connect and manage multiple broker connections
    * **Market Data**: Retrieve historical data and option chains
    * **Order Execution**: Submit and manage orders (market, limit, stop) 
    * **Strategy Execution**: Run and monitor algorithmic trading strategies
    * **Portfolio Tracking**: Monitor positions and portfolio performance

    ### Authentication

    Currently, the API does not require authentication. In production, implement proper security measures.
  
  terms_of_service: "https://example.com/terms/"
  contact:
    name: "API Support"
    url: "https://example.com/contact/"
    email: "support@example.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
  openapi_url: "/api/v1/openapi.json"
  docs_url: "/docs"
  redoc_url: "/redoc"
  logo_url: "https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png"

# ==========================================
# DEFAULTS (Static Framework Defaults)
# ==========================================
defaults:
  contract:
    security_type: "STK"
    currency: "USD"
    exchange: "SMART"
    time_in_force: "DAY"
  
  data:
    duration: "1 D"
    bar_size: "1 hour"
    market_data_type: "DELAYED"
    snapshot: false
    strike_step: 50          # fallback strike spacing when a chain is too sparse to infer it
  
  strategy:
    status: "INITIAL"
    db_path: "trading_system.db"
    
  portfolio:
    total_pnl: 0.0
    open_positions: 0
    closed_positions: 0
    total_positions: 0
    pending_reentries: 0
